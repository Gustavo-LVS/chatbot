<div class="h-dvh overflow-hidden bg-slate-800 flex items-center justify-center p-4 relative">
    <!-- Loading Overlay -->
    <div *ngIf="isRedirecting" class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm flex flex-col items-center justify-center z-50 animate-fade-in">
        <div class="bg-white rounded-2xl shadow-2xl p-8 flex flex-col items-center gap-4">
            <div class="relative">
                <div class="w-16 h-16 border-4 border-emerald-200 rounded-full"></div>
                <div class="absolute inset-0 w-16 h-16 border-4 border-emerald-600 rounded-full border-t-transparent animate-spin"></div>
            </div>
            <div class="text-center">
                <h3 class="text-lg font-semibold text-gray-800 mb-1">Cadastro realizado!</h3>
                <p class="text-sm text-gray-600">Redirecionando para o login...</p>
            </div>
        </div>
    </div>

    <div class="w-full max-w-md">
        
        <!-- Card Principal de Cadastro -->
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
            <!-- Header com Gradiente -->
            <div class="bg-linear-to-r from-emerald-500 to-emerald-600 py-5 px-6 flex flex-col items-center gap-1.5">
                <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur-sm">
                    <fa-icon [icon]="['fas', 'comment']" class="text-white text-2xl"></fa-icon>
                </div>
                <h1 class="text-xl font-semibold text-white tracking-wide">ChatBot</h1>
            </div>
            
            <!-- Conteúdo do Card -->
            <div class="p-5">
                <!-- Título -->
                <div class="text-center mb-4">
                    <h2 class="text-xl font-bold text-gray-800">Crie sua conta</h2>
                </div>
                
                <!-- Formulário -->
                <form #form="ngForm" (ngSubmit)="register(form)" class="space-y-3" novalidate>
                    <!-- Campo Username -->
                    <div class="space-y-1.5">
                        <label for="username" class="block text-sm font-semibold text-gray-700">
                            Nome de usuário
                        </label>
                        <input 
                            id="username" 
                            type="text" 
                            [(ngModel)]="username" 
                            name="username"
                            placeholder="Digite seu nome de usuário"
                            required
                            minlength="3"
                            autocomplete="username"
                            [disabled]="isSubmitting"
                            [class]="'w-full px-4 py-2.5 border-2 rounded-xl text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-4 focus:ring-emerald-500/10 transition-all ' + (form.submitted && !username.trim() ? 'border-red-500 focus:border-red-500' : 'border-gray-200 focus:border-emerald-500') + (isSubmitting ? ' opacity-60 cursor-not-allowed' : '')">
                    </div>

                    <!-- Campo Senha -->
                    <div class="space-y-1.5">
                        <label for="password" class="block text-sm font-semibold text-gray-700">
                            Senha
                        </label>

                        <div class="relative">
                            <input
                                id="password"
                                [type]="showPassword ? 'text' : 'password'"
                                [(ngModel)]="password"
                                name="password"
                                placeholder="Digite sua senha"
                                required
                                minlength="6"
                                autocomplete="new-password"
                                [disabled]="isSubmitting"
                                [class]="'w-full pr-12 px-4 py-2.5 border-2 rounded-xl text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-4 focus:ring-emerald-500/10 transition-all ' + (form.submitted && !password ? 'border-red-500 focus:border-red-500' : 'border-gray-200 focus:border-emerald-500') + (isSubmitting ? ' opacity-60 cursor-not-allowed' : '')" />

                            <button
                                type="button"
                                (click)="togglePasswordVisibility()"
                                [disabled]="isSubmitting"
                                [attr.aria-pressed]="showPassword"
                                class="absolute right-2 top-1/2 -translate-y-1/2 px-3 py-2 text-gray-500 hover:text-gray-700 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed">
                                <fa-icon [icon]="['fas', showPassword ? 'eye-slash' : 'eye']" class="text-sm"></fa-icon>
                            </button>
                        </div>
                    </div>

                    <!-- Campo Confirmar Senha -->
                    <div class="space-y-1.5">
                        <label for="confirmPassword" class="block text-sm font-semibold text-gray-700">
                            Confirmar senha
                        </label>

                        <div class="relative">
                            <input
                                id="confirmPassword"
                                [type]="showConfirmPassword ? 'text' : 'password'"
                                [(ngModel)]="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirme sua senha"
                                required
                                minlength="6"
                                autocomplete="new-password"
                                [disabled]="isSubmitting"
                                [class]="'w-full pr-12 px-4 py-2.5 border-2 rounded-xl text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-4 focus:ring-emerald-500/10 transition-all ' + (form.submitted && !confirmPassword ? 'border-red-500 focus:border-red-500' : 'border-gray-200 focus:border-emerald-500') + (isSubmitting ? ' opacity-60 cursor-not-allowed' : '')" />

                            <button
                                type="button"
                                (click)="toggleConfirmPasswordVisibility()"
                                [disabled]="isSubmitting"
                                [attr.aria-pressed]="showConfirmPassword"
                                class="absolute right-2 top-1/2 -translate-y-1/2 px-3 py-2 text-gray-500 hover:text-gray-700 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed">
                                <fa-icon [icon]="['fas', showConfirmPassword ? 'eye-slash' : 'eye']" class="text-sm"></fa-icon>
                            </button>
                        </div>
                    </div>

                    <!-- Botão Cadastrar -->
                    <button 
                        type="submit"
                        [disabled]="isSubmitting"
                        class="w-full px-4 py-2.5 bg-emerald-600 text-white rounded-xl font-semibold hover:bg-emerald-700 focus:outline-none focus:ring-4 focus:ring-emerald-500/50 transition-all shadow-lg shadow-emerald-600/30 hover:shadow-xl hover:shadow-emerald-600/40 active:scale-[0.98] disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:bg-emerald-600 disabled:active:scale-100">
                        {{ isSubmitting ? 'Cadastrando...' : 'Cadastrar' }}
                    </button>
                </form>
            </div>
        </div>

        <!-- Card Login -->
        <div class="bg-white/10 backdrop-blur-sm border border-white/20 rounded-2xl p-3 mt-3">
            <p class="text-sm text-center text-gray-300">
                Já tem uma conta?
                <a [routerLink]="['/']" class="text-emerald-400 hover:text-emerald-300 font-semibold hover:underline transition-colors ml-1">
                    Entrar
                </a>
            </p>
        </div>

        <!-- Footer -->
        <div class="flex flex-col items-center mt-4">
            <p class="text-xs text-gray-500 text-center leading-relaxed">
                Ao continuar, você concorda com nossos<br>
                <a href="#" class="text-gray-400 hover:text-gray-300 underline transition-colors">Termos de Uso</a> e 
                <a href="#" class="text-gray-400 hover:text-gray-300 underline transition-colors">Política de Privacidade</a>
            </p>
        </div>

    </div>
</div>
