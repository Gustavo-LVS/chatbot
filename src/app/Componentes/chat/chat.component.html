<div class="chat-container">
    <div class="chat-header">
        <h1>ChatBot</h1>
    </div>

    <div class="messages-area">
        <div class="message" *ngFor="let msg of messages" [class.user-message]="msg.isUser">
            <div class="message-content">
                {{ msg.text }}
            </div>
        </div>
    </div>

    <div class="input-area">
        <input #messageInput type="text" placeholder="Digite sua mensagem..." (keyup.enter)="sendMessage(messageInput)">
        <button (click)="sendMessage(messageInput)">
            Enviar
        </button>
    </div>
</div>
