<div class="flex h-screen overflow-hidden bg-slate-800">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 h-screen flex flex-col border-r border-slate-700">
        <!-- Sidebar Header -->
        <div class="p-4 border-b border-slate-700">
            <button class="w-full px-4 py-2.5 bg-slate-700 text-white rounded-xl hover:bg-slate-600 transition-colors flex items-center justify-center gap-2.5 font-medium text-base">
                <fa-icon [icon]="['fas', 'plus']" class="text-base"></fa-icon>
                Novo chat
            </button>
        </div>

        <!-- Sidebar Navigation -->
        <nav class="flex-1 overflow-y-auto py-2">
            <div class="px-2 flex flex-col gap-1">
                <div class="flex items-center gap-3 px-4 py-2.5 bg-slate-800 text-white cursor-pointer transition-colors text-sm rounded-xl">
                    <fa-icon [icon]="['fas', 'comment']" class="text-sm"></fa-icon>
                    <span class="truncate">Como posso ajudar?</span>
                </div>

                <div class="flex items-center gap-3 px-4 py-2.5 text-slate-300 hover:bg-slate-800 cursor-pointer transition-colors text-sm rounded-xl">
                    <fa-icon [icon]="['fas', 'comment']" class="text-sm"></fa-icon>
                    <span class="truncate">Conversa anterior</span>
                </div>
            </div>
        </nav>

        <!-- Sidebar Footer -->
        <div class="p-4 border-t border-slate-700">
            <div class="flex items-center gap-3 px-4 py-2.5 text-slate-300 hover:bg-slate-800 cursor-pointer transition-colors text-sm rounded-xl">
                <div class="w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center text-white">
                    <fa-icon [icon]="['fas', 'user']"></fa-icon>
                </div>
                <span class="truncate">{{ username }}</span>
            </div>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col bg-slate-800 h-screen">
        <!-- Chat Header -->
        <header class="bg-slate-900 border-b border-slate-700 px-5 py-4 flex items-center justify-between">
            <div class="text-white font-semibold text-xl tracking-wide">ChatBot</div>
            <div class="flex gap-3 items-center">
                <button class="w-11 h-11 rounded-xl flex items-center justify-center text-slate-300 hover:bg-slate-700 transition-colors" title="Configurações">
                    <fa-icon [icon]="['fas', 'cog']" class="text-lg"></fa-icon>
                </button>
                <button (click)="logout()" class="w-11 h-11 rounded-xl flex items-center justify-center text-red-300 hover:bg-slate-700 transition-colors" title="Sair">
                    <fa-icon [icon]="['fas', 'sign-out-alt']" class="text-lg"></fa-icon>
                </button>
            </div>
        </header>

        <!-- Chat Messages -->
        <div class="flex-1 overflow-y-auto">
            @if (messages.length === 0) {
            <!-- Empty State -->
            <div class="flex items-center justify-center h-full px-4 text-center">
                <div class="flex flex-col gap-4">
                    <div class="w-16 h-16 rounded-full bg-slate-700 flex items-center justify-center mb-4 mx-auto">
                        <fa-icon [icon]="['fas', 'comment']" size="2x" class="text-slate-400"></fa-icon>
                    </div>
                    <h2 class="text-2xl font-semibold text-white mb-2">Como posso ajudar?</h2>
                    <p class="text-slate-400 max-w-md">Faça uma pergunta ou inicie uma conversa</p>
                </div>
            </div>
            } @else {
            <!-- Messages List -->
            @for (msg of messages; track $index) {
            <div class="w-full border-b border-slate-700/50" [ngClass]="msg.isUser ? 'bg-slate-800' : 'bg-[#1a2332]'">
                <div class="max-w-3xl mx-auto px-4 py-6 flex gap-4">
                    <div [ngClass]="msg.isUser ? 'bg-emerald-600' : 'bg-slate-600'" class="w-8 h-8 rounded-sm flex items-center justify-center text-white shrink-0">
                        @if (msg.isUser) {
                        <fa-icon [icon]="['fas', 'user']"></fa-icon>
                        } @else {
                        <fa-icon [icon]="['fas', 'comment']"></fa-icon>
                        }
                    </div>
                    <div class="flex-1 text-slate-100 leading-relaxed text-[15px]">
                        {{ msg.text }}
                    </div>
                </div>
            </div>
            }
            }
        </div>

        <!-- Chat Input -->
        <div class="bg-slate-800 px-4 py-4">
            <div class="max-w-3xl mx-auto relative flex items-center">
                <textarea 
                    #msgInput 
                    rows="1" 
                    placeholder="Envie uma mensagem..." 
                    class="w-full bg-slate-700 text-white rounded-2xl border border-slate-600 focus:border-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-500/50 placeholder-slate-400 pr-14 px-4 py-3.5 text-base leading-relaxed align-middle"
                    style="resize: none; max-height: 180px;"
                    (keydown.enter)="handleEnter($any($event), msgInput)"></textarea>
                <div class="absolute inset-y-0 right-3 flex items-center">
                    <button (click)="sendMessage(msgInput)" class="w-10 h-10 rounded-xl bg-slate-600 hover:bg-emerald-600 grid place-items-center text-white transition-colors leading-none">
                        <fa-icon [icon]="['fas', 'paper-plane']" class="text-lg block"></fa-icon>
                    </button>
                </div>
            </div>
        </div>
    </main>
</div>
