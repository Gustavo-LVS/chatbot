<div class="h-dvh overflow-hidden bg-slate-800 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        
        <!-- Card Principal de Login -->
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
            <!-- Header com Gradiente -->
            <div class="bg-linear-to-r from-emerald-500 to-emerald-600 py-5 px-6 flex flex-col items-center gap-1.5">
                <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur-sm">
                    <fa-icon [icon]="['fas', 'comment']" class="text-white text-2xl"></fa-icon>
                </div>
                <h1 class="text-xl font-semibold text-white tracking-wide">ChatBot</h1>
            </div>
            
            <!-- Conteúdo do Card -->
            <div class="p-5">
                <!-- Mensagem de Sessão (expirada/requerida) -->
                @if (sessionMessage) {
                    <div class="mb-4 p-3 bg-amber-50 border border-amber-200 rounded-xl flex items-start gap-3">
                        <fa-icon [icon]="['fas', 'exclamation-triangle']" class="text-amber-500 mt-0.5"></fa-icon>
                        <div class="flex-1">
                            <p class="text-sm text-amber-800">{{ sessionMessage }}</p>
                        </div>
                        <button 
                            type="button" 
                            (click)="clearSessionMessage()"
                            class="text-amber-400 hover:text-amber-600 transition-colors">
                            <fa-icon [icon]="['fas', 'times']" class="text-sm"></fa-icon>
                        </button>
                    </div>
                }

                <!-- Título e Subtítulo -->
                <div class="text-center mb-4">
                    <h2 class="text-xl font-bold text-gray-800">Bem-vindo de volta!</h2>
                    <p class="text-sm text-gray-500 mt-1">Faça login para continuar</p>
                </div>
                
                <!-- Formulário -->
                <form #form="ngForm" (ngSubmit)="login(form)" class="space-y-3" novalidate>
                    <!-- Campo Username -->
                    <div class="space-y-1.5">
                        <label for="username" class="block text-sm font-semibold text-gray-700">
                            Nome de usuário
                        </label>
                        <input 
                            id="username" 
                            type="text" 
                            [(ngModel)]="username" 
                            name="username"
                            placeholder="Digite seu nome de usuário"
                            required
                            minlength="3"
                            autocomplete="username"
                            [class]="'w-full px-4 py-2.5 border-2 rounded-xl text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-4 focus:ring-emerald-500/10 transition-all ' + (form.submitted && !username.trim() ? 'border-red-500 focus:border-red-500' : 'border-gray-200 focus:border-emerald-500')">
                    </div>

                    <!-- Campo Senha -->
                    <div class="space-y-1.5">
                        <label for="password" class="block text-sm font-semibold text-gray-700">
                            Senha
                        </label>

                        <div class="relative">
                            <input
                                id="password"
                                [type]="showPassword ? 'text' : 'password'"
                                [(ngModel)]="password"
                                name="password"
                                placeholder="Digite sua senha"
                                required
                                minlength="6"
                                autocomplete="current-password"
                                [class]="'w-full pr-12 px-4 py-2.5 border-2 rounded-xl text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-4 focus:ring-emerald-500/10 transition-all ' + (form.submitted && !password ? 'border-red-500 focus:border-red-500' : 'border-gray-200 focus:border-emerald-500')" />

                            <button
                                type="button"
                                (click)="togglePasswordVisibility()"
                                [attr.aria-pressed]="showPassword"
                                class="absolute right-2 top-1/2 -translate-y-1/2 px-3 py-2 text-gray-500 hover:text-gray-700 focus:outline-none">
                                <fa-icon [icon]="['fas', showPassword ? 'eye-slash' : 'eye']" class="text-sm"></fa-icon>
                            </button>
                        </div>
                    </div>

                    <!-- Opções de Sessão -->
                    <div class="flex items-center justify-between text-sm">
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input 
                                type="checkbox" 
                                [(ngModel)]="rememberSession"
                                name="rememberSession"
                                class="w-4 h-4 text-emerald-600 border-gray-300 rounded focus:ring-emerald-500 cursor-pointer">
                            <span class="text-gray-600 group-hover:text-gray-800 transition-colors">
                                Manter conectado
                            </span>
                        </label>
                        <a href="#" class="text-emerald-600 hover:text-emerald-700 font-medium hover:underline transition-colors">
                            Esqueceu a senha?
                        </a>
                    </div>

                    <!-- Botão Entrar -->
                    <button 
                        type="submit"
                        [disabled]="isSubmitting"
                        class="w-full px-4 py-2.5 bg-emerald-600 text-white rounded-xl font-semibold hover:bg-emerald-700 focus:outline-none focus:ring-4 focus:ring-emerald-500/50 transition-all shadow-lg shadow-emerald-600/30 hover:shadow-xl hover:shadow-emerald-600/40 active:scale-[0.98] disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:bg-emerald-600 disabled:active:scale-100 flex items-center justify-center gap-2">
                        @if (isSubmitting) {
                            <fa-icon [icon]="['fas', 'spinner']" class="animate-spin"></fa-icon>
                            <span>Entrando...</span>
                        } @else {
                            <fa-icon [icon]="['fas', 'sign-in-alt']"></fa-icon>
                            <span>Entrar</span>
                        }
                    </button>
                </form>

                <!-- Indicador de Segurança -->
                <div class="mt-4 flex items-center justify-center gap-2 text-xs text-gray-400">
                    <fa-icon [icon]="['fas', 'shield-alt']" class="text-emerald-500"></fa-icon>
                    <span>Conexão segura com autenticação protegida</span>
                </div>
            </div>
        </div>

        <!-- Card Cadastro -->
        <div class="bg-white/10 backdrop-blur-sm border border-white/20 rounded-2xl p-3 mt-3">
            <p class="text-sm text-center text-gray-300">
                Não tem uma conta? 
                <a [routerLink]="['/cadastro']" class="text-emerald-400 hover:text-emerald-300 font-semibold hover:underline transition-colors ml-1">
                    Cadastre-se
                </a>
            </p>
        </div>

        <!-- Footer -->
        <div class="flex flex-col items-center mt-4">
            <p class="text-xs text-gray-500 text-center leading-relaxed">
                Ao continuar, você concorda com nossos<br>
                <a href="#" class="text-gray-400 hover:text-gray-300 underline transition-colors">Termos de Uso</a> e 
                <a href="#" class="text-gray-400 hover:text-gray-300 underline transition-colors">Política de Privacidade</a>
            </p>
        </div>

    </div>
</div>
