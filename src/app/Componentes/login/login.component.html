<div class="min-h-screen bg-slate-800 grid place-items-center p-6">
    <div class="w-full max-w-md grid gap-6">
        <!-- Card de Login -->
        <div class="bg-slate-900 rounded-2xl shadow-2xl border border-slate-700 grid gap-8 p-10">

            <!-- Logo/Título -->
            <div class="grid gap-4 justify-items-center text-center">
                <div class="w-20 h-20 bg-emerald-600 rounded-full grid place-items-center shadow-lg shadow-emerald-900/50">
                    <fa-icon [icon]="['fas', 'comment']" size="2x" class="text-white"></fa-icon>
                </div>
                <div class="grid gap-2">
                    <h1 class="text-3xl font-bold text-white">Bem-vindo ao ChatBot</h1>
                    <p class="text-slate-400 text-sm">Entre para começar a conversar</p>
                </div>
            </div>

            <!-- Formulário -->
            <form (ngSubmit)="login()" class="grid gap-6">
                <div class="grid gap-3">
                    <label for="username" class="grid grid-cols-[auto_1fr] items-center gap-2 text-sm font-medium text-slate-300">
                        <fa-icon [icon]="['fas', 'user']"></fa-icon>
                        <span>Nome de usuário</span>
                    </label>
                    <div class="relative grid">
                        <div class="absolute inset-y-0 left-0 pl-3 grid place-items-center pointer-events-none">
                            <fa-icon [icon]="['fas', 'user']" class="text-slate-500"></fa-icon>
                        </div>
                        <input id="username" type="text" [(ngModel)]="username" name="username"
                            placeholder="Digite seu nome" required
                            class="w-full pl-10 pr-4 py-3.5 bg-slate-800 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all">
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 px-4 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 focus:ring-offset-slate-900 grid grid-cols-[1fr_auto] items-center gap-3 shadow-lg shadow-emerald-900/30">
                    <span class="text-center">Continuar</span>
                    <fa-icon [icon]="['fas', 'arrow-right']"></fa-icon>
                </button>
            </form>

            <!-- Footer -->
            <div class="grid gap-4 pt-6 border-t border-slate-700">
                <p class="text-center text-xs text-slate-500 leading-relaxed">
                    Ao continuar, você concorda com nossos Termos de Uso
                </p>
            </div>
        </div>

        <!-- Info adicional -->
        <div class="grid gap-2 justify-items-center">
            <p class="text-sm text-slate-500">Não tem uma conta?</p>
            <a href="#" class="text-emerald-500 hover:text-emerald-400 transition-colors grid grid-cols-[auto_auto] items-center gap-2 font-medium">
                <fa-icon [icon]="['fas', 'user-plus']"></fa-icon>
                <span>Criar conta</span>
            </a>
        </div>
    </div>
</div>
